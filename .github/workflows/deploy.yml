name: CD - Deploy Application

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: main

  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        type: string
        default: main

env:
  AWS_REGION: us-east-1
  APP_DIR: vendor-services-booking
  ARTIFACT_PREFIX: artifacts

jobs:
  infra:
    name: Apply infrastructure (prerequisite for app deploy)
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Build & deploy app to ASG instances
    needs: infra
    runs-on: ubuntu-latest

    env:
      ARTIFACT_BUCKET: ${{ needs.infra.outputs.s3_bucket }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install Composer dependencies
        working-directory: ${{ env.APP_DIR }}
        run: composer install --no-dev --optimize-autoloader

      - name: Package application
        working-directory: ${{ env.APP_DIR }}
        run: zip -r ../assignment-app.zip . -x "uploads/*"

      - name: Upload artifact to S3
        run: |
          aws s3 cp assignment-app.zip \
            "s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/assignment-app.zip"

      - name: Get ASG instance
        id: ec2
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..30}; do
            INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names assignment-asg \
              --query "AutoScalingGroups[0].Instances[0].InstanceId" \
              --output text)

            if [ "$INSTANCE_ID" != "None" ]; then
              echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
              echo "Found instance: $INSTANCE_ID"
              exit 0
            fi

            echo "Waiting for ASG instance... ($i/30)"
            sleep 10
          done

          echo "No ASG instance found"
          exit 1

      - name: Wait for SSM Online
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"

          for i in {1..40}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "None")

            echo "Attempt $i: $STATUS"

            if [ "$STATUS" = "Online" ]; then
              echo "SSM is ready."
              exit 0
            fi

            sleep 15
          done

          echo "Instance never became SSM Online"
          exit 1

      - name: Deploy via SSM
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "assignment deploy" \
            --parameters commands='[
              "cloud-init status --wait",
              "aws s3 cp s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/assignment-app.zip /tmp/assignment-app.zip",
              "sudo unzip -o /tmp/assignment-app.zip -d /var/www/html",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id assignment-db-credentials --region us-east-1 --query SecretString --output text)",
              "DB_HOST=$(echo $SECRET_JSON | jq -r .host)",
              "DB_USER=$(echo $SECRET_JSON | jq -r .username)",
              "DB_PASS=$(echo $SECRET_JSON | jq -r .password)",
              "DB_NAME=$(echo $SECRET_JSON | jq -r .dbname)",
              "printf \"DB_HOST=%s\nDB_USER=%s\nDB_PASS=%s\nDB_NAME=%s\n\" \"$DB_HOST\" \"$DB_USER\" \"$DB_PASS\" \"$DB_NAME\" | sudo tee /var/www/html/.env >/dev/null",
              "sudo chown -R apache:apache /var/www/html",
              "sudo find /var/www/html -type d -exec chmod 755 {} \\;",
              "sudo find /var/www/html -type f -exec chmod 644 {} \\;",
              "sudo chmod 640 /var/www/html/.env",
              "sudo systemctl restart httpd",
              "echo status: done"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Command ID: $COMMAND_ID"

      - name: Wait for deployment
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text)

            echo "Status: $STATUS"

            case "$STATUS" in
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              Success)
                echo "Deployment completed!"
                break
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac
          done

      - name: Show deployment output
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}"